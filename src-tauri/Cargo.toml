[package]
name = "ryo-wallet-next"
version = "0.1.0-alpha.6"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[lib]
name = "ryo_wallet_next"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.6", features = [] }
ryo-wallet-service = { path = "../crates/ryo-wallet-service" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tauri-plugin-clipboard-manager = "=2.3.3"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "=2.5.5"
uuid = { version = "=1.26.1", features = ["v4"] }
zeroize.workspace = true
tauri-plugin-updater = "=2.12.0"
tempfile = "=3.27.0"
