[package]
name = "ryo-wallet-service"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
zeroize.workspace = true
reqwest.workspace = true
tokio.workspace = true
digest_auth = "=0.3.1"
ts-rs = "=12.0.1"
sha2.workspace = true
uuid = { version = "=1.26.1", features = ["v4"] }
tempfile = "=3.27.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_JobObjects"] }

[dev-dependencies]
tokio = { workspace = true, features = ["net", "io-util"] }
