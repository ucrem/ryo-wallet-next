name: checks

on:
  pull_request:
    branches: [staging]

permissions:
  contents: read

jobs:
  rust-foundation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust toolchain and components
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt,clippy
          rustup default 1.98.1
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy for reusable service
        run: cargo clippy -p ryo-wallet-service --all-targets --locked -- -D warnings
      - name: Service tests and generated type drift
        run: |
          cargo test -p ryo-wallet-service --locked
          git diff --exit-code -- src/api/generated

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.6.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install exact frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate application and changelog versions
        run: pnpm check:version
      - name: Typecheck and lint
        run: |
          pnpm typecheck
          pnpm lint
      - name: Frontend tests and production build
        run: |
          pnpm test
          pnpm build
      - name: Validate update manifest preparation
        run: |
          python3 -m unittest discover -s scripts -p 'test_prepare_update_assets.py'
          node --test scripts/test_prepare_wallet_runtime.mjs

  testnet-genesis-integration:
    name: Isolated testnet genesis (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          rustup default 1.98.1
      - name: Prepare unchanged reviewed native runtimes
        run: node scripts/prepare-dev-runtime.mjs
      - name: Observe public testnet availability from this runner
        continue-on-error: true
        run: node scripts/probe-testnet.mjs 30
      - name: Funded and busy-scan cache fixtures (genesis fork, not current-fork acceptance)
        shell: bash
        run: |
          suffix=""
          if [[ "$RUNNER_OS" == "Windows" ]]; then suffix=".exe"; fi
          export RYO_TEST_DAEMON="$GITHUB_WORKSPACE/src-tauri/.dev-runtime/ryod$suffix"
          export RYO_TEST_WALLET_RPC="$GITHUB_WORKSPACE/src-tauri/.dev-runtime/ryo-wallet-rpc$suffix"
          export RYO_VALIDATION_REPORT="$GITHUB_WORKSPACE/target/testnet-genesis-report.json"
          export RYO_SCAN_RESUME_REPORT="$GITHUB_WORKSPACE/target/wallet-scan-resume-report.json"
          cargo test -p ryo-wallet-service --test testnet_validation --locked -- --ignored --nocapture --test-threads=1
      - name: Upload non-sensitive acceptance and availability receipts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: testnet-genesis-receipt-${{ matrix.os }}
          path: |
            target/testnet-genesis-report.json
            target/wallet-scan-resume-report.json
            target/testnet-validation/probe-*/report.json
          if-no-files-found: error
          retention-days: 30

  tauri-linux-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.6.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          rustup default 1.98.1
      - name: Install Tauri Linux build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Build frontend assets
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          node scripts/prepare-dev-runtime.mjs
      - name: Check Tauri host
        run: cargo check -p ryo-wallet-next --locked
      - name: Verify wallet-file import with disposable copied wallets
        run: cargo test -p ryo-wallet-next --lib wallet_import --locked -- --ignored --nocapture
      - name: Verify independent local-node lifecycle with disposable wallet
        env:
          RYO_TEST_DAEMON: ${{ github.workspace }}/src-tauri/.dev-runtime/ryod
          RYO_TEST_WALLET_RPC: ${{ github.workspace }}/src-tauri/.dev-runtime/ryo-wallet-rpc
        run: cargo test -p ryo-wallet-service --test locked_node --locked -- --ignored
