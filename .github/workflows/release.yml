name: Publish desktop release

on:
  pull_request:
    branches: [main]
    types: [closed]

  workflow_dispatch:
    inputs:
      staging_sha:
        description: "Staging commit whose installer build must be reused"
        required: true
        type: string
      target_sha:
        description: "Commit on main to tag; empty means current main"
        required: false
        type: string
      prerelease:
        description: "Publish as a prerelease"
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  actions: read

jobs:
  release:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.pull_request.merged == true &&
        github.event.pull_request.head.ref == 'staging' &&
        github.event.pull_request.head.repo.full_name == github.repository
      )

    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve and verify release source
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          INPUT_STAGING_SHA: ${{ inputs.staging_sha }}
          INPUT_TARGET_SHA: ${{ inputs.target_sha }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail

          git fetch origin main staging --force --no-tags

          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            STAGING_SHA="$(jq -r '.pull_request.head.sha' "$GITHUB_EVENT_PATH")"
            TARGET_SHA="$(jq -r '.pull_request.merge_commit_sha' "$GITHUB_EVENT_PATH")"

            test "$(jq -r '.pull_request.merged' "$GITHUB_EVENT_PATH")" = "true"
            test "$(jq -r '.pull_request.head.ref' "$GITHUB_EVENT_PATH")" = "staging"
            test "$(jq -r '.pull_request.head.repo.full_name' "$GITHUB_EVENT_PATH")" = "$GH_REPO"
          else
            STAGING_SHA="$INPUT_STAGING_SHA"
            TARGET_SHA="$INPUT_TARGET_SHA"

            if [ -z "$TARGET_SHA" ]; then
              TARGET_SHA="$(git rev-parse origin/main)"
            fi
          fi

          git cat-file -e "$STAGING_SHA^{commit}"
          git cat-file -e "$TARGET_SHA^{commit}"

          # The release target must already be on main.
          git merge-base --is-ancestor "$TARGET_SHA" origin/main

          # Ensures the exact staging commit whose binaries were built
          # is actually contained in the commit being released.
          git merge-base --is-ancestor "$STAGING_SHA" "$TARGET_SHA"

          TAURI_VERSION="$(
            git show "$TARGET_SHA:src-tauri/tauri.conf.json" |
              jq -r '.version'
          )"

          PACKAGE_VERSION="$(
            git show "$TARGET_SHA:package.json" |
              jq -r '.version'
          )"

          CARGO_VERSION="$(
            git show "$TARGET_SHA:src-tauri/Cargo.toml" |
              python3 -c 'import sys, tomllib; print(tomllib.load(sys.stdin.buffer)["package"]["version"])'
          )"

          test -n "$TAURI_VERSION"
          test "$TAURI_VERSION" != "null"
          test "$TAURI_VERSION" = "$PACKAGE_VERSION"
          test "$TAURI_VERSION" = "$CARGO_VERSION"

          VERSION="$TAURI_VERSION"
          TAG="v$VERSION"

          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: $VERSION"
            exit 1
          fi

          if gh release view "$TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
            exit 1
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists"
            exit 1
          fi

          PRERELEASE=false

          case "$VERSION" in
            *-alpha*|*-beta*|*-rc*)
              PRERELEASE=true
              ;;
          esac

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] &&
             [ "$INPUT_PRERELEASE" = "true" ]; then
            PRERELEASE=true
          fi

          RUN_ID="$(
            gh api \
              "repos/$GH_REPO/actions/workflows/desktop-bundles.yml/runs?branch=staging&event=push&head_sha=$STAGING_SHA&per_page=20" \
              --jq '[.workflow_runs[] | select(.conclusion == "success")][0].id // empty'
          )"

          if [ -z "$RUN_ID" ]; then
            echo "No successful staging installer build found for $STAGING_SHA"
            exit 1
          fi

          echo "staging_sha=$STAGING_SHA" >> "$GITHUB_OUTPUT"
          echo "target_sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

      - name: Download verified staging installers
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ steps.source.outputs.run_id }}
        run: |
          set -euo pipefail

          rm -rf staging-artifacts release-assets
          mkdir -p staging-artifacts release-assets

          gh run download "$RUN_ID" \
            --repo "$GH_REPO" \
            --dir staging-artifacts

      - name: Verify release files and checksums
        env:
          GH_REPO: ${{ github.repository }}
          STAGING_SHA: ${{ steps.source.outputs.staging_sha }}
          TARGET_SHA: ${{ steps.source.outputs.target_sha }}
          VERSION: ${{ steps.source.outputs.version }}
          RUN_ID: ${{ steps.source.outputs.run_id }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          deb=(staging-artifacts/preview-linux-x64-deb/*.deb)
          rpm=(staging-artifacts/preview-linux-x64-rpm/*.rpm)
          intel=(staging-artifacts/preview-macos-intel-dmg/*.dmg)
          arm=(staging-artifacts/preview-macos-apple-silicon-dmg/*.dmg)
          windows=(staging-artifacts/preview-windows-x64-exe/*-setup.exe)

          test "${#deb[@]}" -eq 1
          test "${#rpm[@]}" -eq 1
          test "${#intel[@]}" -eq 1
          test "${#arm[@]}" -eq 1
          test "${#windows[@]}" -eq 1

          test "$(find staging-artifacts -type f | wc -l)" -eq 5

          cp "${deb[0]}" release-assets/
          cp "${rpm[0]}" release-assets/
          cp "${intel[0]}" release-assets/
          cp "${arm[0]}" release-assets/
          cp "${windows[0]}" release-assets/

          # Detect filename collisions between architecture-specific artifacts.
          test "$(find release-assets -maxdepth 1 -type f | wc -l)" -eq 5

          (
            cd release-assets
            sha256sum * > SHA256SUMS.txt
          )

          cat > release-notes.md <<EOF
          Ryo Wallet Next v$VERSION

          Development preview.

          These installers are the exact artifacts previously built and verified
          from staging commit:

          \`$STAGING_SHA\`

          Release commit on main:

          \`$TARGET_SHA\`

          Source GitHub Actions run:
          https://github.com/$GH_REPO/actions/runs/$RUN_ID

          This development preview does not yet provide complete production wallet
          functionality. Do not use it with funds.

          SHA-256 checksums are included in \`SHA256SUMS.txt\`.
          EOF

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.source.outputs.tag }}
          VERSION: ${{ steps.source.outputs.version }}
          TARGET_SHA: ${{ steps.source.outputs.target_sha }}
          PRERELEASE: ${{ steps.source.outputs.prerelease }}
        run: |
          set -euo pipefail

          args=(
            --repo "$GH_REPO"
            --target "$TARGET_SHA"
            --title "Ryo Wallet Next $TAG"
            --notes-file release-notes.md
          )

          if [ "$PRERELEASE" = "true" ]; then
            args+=(--prerelease)
          fi

          gh release create \
            "$TAG" \
            release-assets/* \
            "${args[@]}"