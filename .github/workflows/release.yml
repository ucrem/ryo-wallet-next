name: Publish desktop release

on:
  pull_request:
    branches: [main]
    types: [closed]

  workflow_dispatch:
    inputs:
      staging_sha:
        description: "Staging commit whose installer build must be reused"
        required: true
        type: string
      target_sha:
        description: "Commit on main to tag; empty means current main"
        required: false
        type: string
      prerelease:
        description: "Publish as a prerelease"
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  actions: read

jobs:
  release:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.pull_request.merged == true &&
        github.event.pull_request.head.ref == 'staging' &&
        github.event.pull_request.head.repo.full_name == github.repository
      )

    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Resolve and verify release source
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          INPUT_STAGING_SHA: ${{ inputs.staging_sha }}
          INPUT_TARGET_SHA: ${{ inputs.target_sha }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail

          git fetch origin main staging --force --no-tags

          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            STAGING_SHA="$(jq -r '.pull_request.head.sha' "$GITHUB_EVENT_PATH")"
            TARGET_SHA="$(jq -r '.pull_request.merge_commit_sha' "$GITHUB_EVENT_PATH")"

            test "$(jq -r '.pull_request.merged' "$GITHUB_EVENT_PATH")" = "true"
            test "$(jq -r '.pull_request.head.ref' "$GITHUB_EVENT_PATH")" = "staging"
            test "$(jq -r '.pull_request.head.repo.full_name' "$GITHUB_EVENT_PATH")" = "$GH_REPO"
          else
            STAGING_SHA="$INPUT_STAGING_SHA"
            TARGET_SHA="$INPUT_TARGET_SHA"

            if [ -z "$TARGET_SHA" ]; then
              TARGET_SHA="$(git rev-parse origin/main)"
            fi
          fi

          git cat-file -e "$STAGING_SHA^{commit}"
          git cat-file -e "$TARGET_SHA^{commit}"

          # The release target must already be on main.
          git merge-base --is-ancestor "$TARGET_SHA" origin/main

          # Ensures the exact staging commit whose binaries were built
          # is actually contained in the commit being released.
          git merge-base --is-ancestor "$STAGING_SHA" "$TARGET_SHA"

          # The GitHub merge commit has a different SHA, but must contain
          # exactly the same files as the staging commit that built installers.
          STAGING_TREE="$(git rev-parse "$STAGING_SHA^{tree}")"
          TARGET_TREE="$(git rev-parse "$TARGET_SHA^{tree}")"
          if [ "$STAGING_TREE" != "$TARGET_TREE" ]; then
            echo "Release source differs from the staging installer source"
            echo "staging tree: $STAGING_TREE"
            echo "release tree: $TARGET_TREE"
            exit 1
          fi

          TAURI_VERSION="$(
            git show "$TARGET_SHA:src-tauri/tauri.conf.json" |
              jq -r '.version'
          )"

          PACKAGE_VERSION="$(
            git show "$TARGET_SHA:package.json" |
              jq -r '.version'
          )"

          CARGO_VERSION="$(
            git show "$TARGET_SHA:src-tauri/Cargo.toml" |
              python3 -c 'import sys, tomllib; print(tomllib.load(sys.stdin.buffer)["package"]["version"])'
          )"

          test -n "$TAURI_VERSION"
          test "$TAURI_VERSION" != "null"
          test "$TAURI_VERSION" = "$PACKAGE_VERSION"
          test "$TAURI_VERSION" = "$CARGO_VERSION"

          # Validate the complete version set from the exact main commit being
          # released, including Cargo.lock and the bundled changelog entry.
          VERSION_SOURCE="$(mktemp -d)"
          trap 'rm -rf "$VERSION_SOURCE"' EXIT
          for source in package.json src-tauri/tauri.conf.json src-tauri/Cargo.toml Cargo.lock CHANGELOG.md scripts/check-version-consistency.mjs; do
            mkdir -p "$VERSION_SOURCE/$(dirname "$source")"
            git show "$TARGET_SHA:$source" > "$VERSION_SOURCE/$source"
          done
          node "$VERSION_SOURCE/scripts/check-version-consistency.mjs"

          VERSION="$TAURI_VERSION"
          TAG="v$VERSION"

          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: $VERSION"
            exit 1
          fi

          if gh release view "$TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
            exit 1
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists"
            exit 1
          fi

          PRERELEASE=false

          case "$VERSION" in
            *-alpha*|*-beta*|*-rc*)
              PRERELEASE=true
              ;;
          esac

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] &&
             [ "$INPUT_PRERELEASE" = "true" ]; then
            PRERELEASE=true
          fi

          RUN_ID="$(
            gh api \
              "repos/$GH_REPO/actions/workflows/desktop-bundles.yml/runs?branch=staging&event=push&head_sha=$STAGING_SHA&per_page=20" \
              --jq '[.workflow_runs[] | select(.conclusion == "success")][0].id // empty'
          )"

          if [ -z "$RUN_ID" ]; then
            echo "No successful staging installer build found for $STAGING_SHA"
            exit 1
          fi

          # Package the release with the exact scripts that were promoted,
          # even if main receives another merge before this job starts.
          git checkout --detach "$TARGET_SHA"

          echo "staging_sha=$STAGING_SHA" >> "$GITHUB_OUTPUT"
          echo "target_sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

      - name: Download verified staging installers
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ steps.source.outputs.run_id }}
        run: |
          set -euo pipefail

          rm -rf staging-artifacts release-assets
          mkdir -p staging-artifacts

          gh run download "$RUN_ID" \
            --repo "$GH_REPO" \
            --dir staging-artifacts

      - name: Verify release files and checksums
        env:
          GH_REPO: ${{ github.repository }}
          STAGING_SHA: ${{ steps.source.outputs.staging_sha }}
          TARGET_SHA: ${{ steps.source.outputs.target_sha }}
          VERSION: ${{ steps.source.outputs.version }}
          RUN_ID: ${{ steps.source.outputs.run_id }}
        run: |
          set -euo pipefail
          python3 scripts/prepare_update_assets.py staging-artifacts release-assets "$VERSION"

          cat > release-notes.md <<EOF
          Ryo Wallet Next v$VERSION

          Development preview.

          These installers are the exact artifacts previously built and verified
          from staging commit:

          \`$STAGING_SHA\`

          Release commit on main:

          \`$TARGET_SHA\`

          Source GitHub Actions run:
          https://github.com/$GH_REPO/actions/runs/$RUN_ID

          This development preview does not yet provide complete production wallet
          functionality. Do not use it with funds.

          SHA-256 checksums are included in \`SHA256SUMS.txt\`.
          EOF

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.source.outputs.tag }}
          VERSION: ${{ steps.source.outputs.version }}
          TARGET_SHA: ${{ steps.source.outputs.target_sha }}
          PRERELEASE: ${{ steps.source.outputs.prerelease }}
        run: |
          set -euo pipefail

          args=(
            --repo "$GH_REPO"
            --target "$TARGET_SHA"
            --title "Ryo Wallet Next $TAG"
            --notes-file release-notes.md
          )

          if [ "$PRERELEASE" = "true" ]; then
            args+=(--prerelease)
          fi

          gh release create \
            "$TAG" \
            release-assets/* \
            "${args[@]}"

      - name: Publish the update feed after the release succeeds
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TARGET_SHA: ${{ steps.source.outputs.target_sha }}
          VERSION: ${{ steps.source.outputs.version }}
        run: |
          set -euo pipefail
          if ! gh api "repos/$GH_REPO/git/ref/heads/update-channel" >/dev/null 2>&1; then
            gh api "repos/$GH_REPO/git/refs" --method POST \
              -f ref=refs/heads/update-channel -f sha="$TARGET_SHA" >/dev/null
          fi

          old_sha="$(gh api "repos/$GH_REPO/contents/latest.json?ref=update-channel" --jq .sha 2>/dev/null || true)"
          base64 -w0 release-assets/latest.json > update-feed.b64
          args=(--method PUT -f "message=Publish signed update feed for v$VERSION" \
            -f branch=update-channel -F content=@update-feed.b64)
          if [ -n "$old_sha" ]; then
            args+=(-f "sha=$old_sha")
          fi
          gh api "repos/$GH_REPO/contents/latest.json" "${args[@]}" >/dev/null
