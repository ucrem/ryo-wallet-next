name: Staging desktop installers

on:
  push:
    branches: [staging]
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: desktop-bundles-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    if: github.event_name == 'push'
    name: Linux x64 (.deb, .rpm)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12.5.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          rustup default 1.98.1
      - name: Install Tauri Linux build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf rpm
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Build DEB and RPM previews
        run: pnpm exec tauri build --ci --bundles deb,rpm
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: preview-linux-x64-deb
          path: target/release/bundle/deb/*.deb
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: preview-linux-x64-rpm
          path: target/release/bundle/rpm/*.rpm
          if-no-files-found: error
          retention-days: 30

  macos:
    if: github.event_name == 'push'
    name: macOS ${{ matrix.arch }} (.dmg)
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: intel
            runner: macos-15-intel
          - arch: apple-silicon
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12.5.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          rustup default 1.98.1
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Build ad-hoc signed DMG preview
        env:
          APPLE_SIGNING_IDENTITY: "-"
        run: pnpm exec tauri build --ci --bundles dmg
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: preview-macos-${{ matrix.arch }}-dmg
          path: target/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 30

  windows:
    if: github.event_name == 'push'
    name: Windows x64 (.exe)
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12.5.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          rustup default 1.98.1
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Build unsigned NSIS installer preview
        run: pnpm exec tauri build --ci --bundles nsis --no-sign
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: preview-windows-x64-exe
          path: target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 30

  promote:
    if: github.event_name == 'pull_request'
    name: Reuse staging installers for main
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Require a staging PR and find its exact build
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          STAGING_SHA: ${{ github.event.pull_request.head.sha }}
          SOURCE_BRANCH: ${{ github.event.pull_request.head.ref }}
          SOURCE_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          test "$SOURCE_REPO" = "$GH_REPO"
          test "$SOURCE_BRANCH" = staging
          test "$(gh api "repos/$GH_REPO/compare/main...$STAGING_SHA" --jq .status)" = ahead
          run_id=""
          for attempt in {1..60}; do
            run_id="$(gh run list --branch staging --commit "$STAGING_SHA" --event push --json databaseId,workflowName --limit 20 --jq '[.[] | select(.workflowName == "Staging desktop installers")][0].databaseId // empty')"
            if [ -n "$run_id" ]; then
              break
            fi
            sleep 20
          done
          test -n "$run_id"
          gh run watch "$run_id" --exit-status --interval 20
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
      - name: Download the staging artifacts without rebuilding
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ steps.source.outputs.run_id }}
        run: gh run download "$RUN_ID" --dir staging-artifacts
      - name: Verify all five installers and record their checksums
        env:
          GH_REPO: ${{ github.repository }}
          STAGING_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_ID: ${{ steps.source.outputs.run_id }}
        run: |
          shopt -s nullglob
          deb=(staging-artifacts/preview-linux-x64-deb/*.deb)
          rpm=(staging-artifacts/preview-linux-x64-rpm/*.rpm)
          intel=(staging-artifacts/preview-macos-intel-dmg/*.dmg)
          arm=(staging-artifacts/preview-macos-apple-silicon-dmg/*.dmg)
          windows=(staging-artifacts/preview-windows-x64-exe/*-setup.exe)
          test "${#deb[@]}" -eq 1
          test "${#rpm[@]}" -eq 1
          test "${#intel[@]}" -eq 1
          test "${#arm[@]}" -eq 1
          test "${#windows[@]}" -eq 1
          test "$(find staging-artifacts -type f | wc -l)" -eq 5
          {
            echo "### Staging installers reused for main"
            echo "Commit: \`$STAGING_SHA\`"
            echo "Source run: https://github.com/$GH_REPO/actions/runs/$RUN_ID"
            echo 'SHA-256:'
            echo '```'
            sha256sum "${deb[@]}" "${rpm[@]}" "${intel[@]}" "${arm[@]}" "${windows[@]}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: staging-installers-${{ github.event.pull_request.head.sha }}
          path: staging-artifacts/
          if-no-files-found: error
          retention-days: 30
