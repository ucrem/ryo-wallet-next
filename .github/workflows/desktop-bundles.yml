name: Staging desktop installers

on:
  push:
    branches: [staging]

permissions:
  contents: read
  actions: read

concurrency:
  group: desktop-bundles-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux x64 (.deb, .rpm)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.6.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          rustup default 1.98.1
      - name: Install Tauri Linux build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf rpm
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Build signed DEB and RPM previews
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm exec tauri build --ci --bundles deb,rpm
      - name: Verify Linux package runtime digests
        run: bash scripts/verify-linux-bundles.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: preview-linux-x64-deb
          path: target/release/bundle/deb/*.deb*
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: preview-linux-x64-rpm
          path: target/release/bundle/rpm/*.rpm*
          if-no-files-found: error
          retention-days: 30

  macos:
    name: macOS Intel (.dmg)
    runs-on: macos-15-intel

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.6.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          rustup default 1.98.1

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build unsigned macOS app, DMG and updater archive
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          pnpm exec tauri build --ci --bundles app,dmg --no-sign

      - name: Verify macOS app runtime and DMG integrity
        run: |
          set -euo pipefail

          sidecar='Ryo Wallet Next.app/Contents/MacOS/ryo-wallet-rpc'
          sidecar_path="target/release/bundle/macos/$sidecar"

          if [[ ! -f "$sidecar_path" ]]; then
            echo "macOS wallet RPC sidecar is missing: $sidecar_path" >&2
            exit 1
          fi

          python3 scripts/verify-packaged-runtime.py \
            --target x86_64-apple-darwin \
            --path "$sidecar_path"

          otool -L "$sidecar_path"

          shopt -s nullglob
          dmgs=(target/release/bundle/dmg/*.dmg)

          if (( ${#dmgs[@]} != 1 )); then
            echo "Expected exactly one macOS DMG, found ${#dmgs[@]}" >&2
            exit 1
          fi

          hdiutil verify "${dmgs[0]}"

      - name: Sign macOS updater artifact
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          updaters=(target/release/bundle/macos/*.app.tar.gz)

          if (( ${#updaters[@]} != 1 )); then
            echo "Expected exactly one macOS updater archive, found ${#updaters[@]}" >&2
            exit 1
          fi

          updater="${updaters[0]}"

          version="$(
            python3 -c \
              'import json; print(json.load(open("src-tauri/tauri.conf.json"))["version"])'
          )"

          if [[ -z "$version" ]]; then
            echo "Could not resolve application version" >&2
            exit 1
          fi

          rm -f "$updater.sig"

          pnpm exec tauri signer sign \
            --app-version "$version" \
            "$updater"

          signature="$updater.sig"

          if [[ ! -s "$signature" ]]; then
            echo "macOS updater signature was not generated: $signature" >&2
            exit 1
          fi

          # requireSignedVersion=true: verify that the generated signature
          # actually contains the expected version binding.
          python3 - "$signature" "$version" <<'PY'
          import base64
          import sys

          signature_path = sys.argv[1]
          expected_version = sys.argv[2]

          encoded = open(signature_path, "rb").read().strip()

          try:
              decoded = base64.b64decode(encoded, validate=True).decode("utf-8")
          except Exception as error:
              raise SystemExit(
                  f"Could not decode updater signature {signature_path}: {error}"
              )

          marker = f"\tversion:{expected_version}"

          if marker not in decoded:
              raise SystemExit(
                  f"Updater signature is not bound to version {expected_version}"
              )

          print(
              f"Verified updater signature version binding: {expected_version}"
          )
          PY

          updater_files=(target/release/bundle/macos/*.app.tar.gz*)

          if (( ${#updater_files[@]} != 2 )); then
            echo "Expected updater archive + signature, found ${#updater_files[@]} files" >&2
            printf '%s\n' "${updater_files[@]}" >&2
            exit 1
          fi

          echo "macOS updater archive: $updater"
          echo "macOS updater signature: $signature"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: preview-macos-intel-dmg
          path: target/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: preview-macos-intel-updater
          path: |
            target/release/bundle/macos/*.app.tar.gz
            target/release/bundle/macos/*.app.tar.gz.sig
          if-no-files-found: error
          retention-days: 30

  windows:
    name: Windows x64 (.exe)
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.6.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          rustup default 1.98.1
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Build unsigned NSIS installer preview
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm exec tauri build --ci --bundles nsis
      - name: Verify NSIS package contains the reviewed wallet runtime
        shell: pwsh
        run: |
          $extractor = Join-Path $env:ProgramFiles '7-Zip\7z.exe'
          if (-not (Test-Path $extractor)) { throw '7-Zip is required to inspect the NSIS installer' }
          $installer = (Get-ChildItem 'target/release/bundle/nsis/*-setup.exe' | Select-Object -First 1).FullName
          if (-not $installer) { throw 'NSIS installer is missing' }
          New-Item -ItemType Directory -Force 'target/nsis-inspection' | Out-Null
          & $extractor x -y "-otarget/nsis-inspection" $installer | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Could not extract the NSIS installer' }
          $sidecars = @(Get-ChildItem 'target/nsis-inspection' -Recurse -File -Filter 'ryo-wallet-rpc.exe')
          if ($sidecars.Count -ne 1) { throw "Expected one packaged wallet RPC, found $($sidecars.Count)" }
          python scripts/verify-packaged-runtime.py --target x86_64-pc-windows-msvc --path $sidecars[0].FullName
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: preview-windows-x64-exe
          path: target/release/bundle/nsis/*-setup.exe*
          if-no-files-found: error
          retention-days: 30
