[workspace]
resolver = "3"
members = ["crates/ryo-wallet-service", "src-tauri"]

[workspace.package]
edition = "2024"
rust-version = "1.98.1"
license = "MIT"

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
thiserror = "=2.0.20"
zeroize = { version = "=1.9.0", features = ["derive"] }
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread", "process", "sync", "time"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "rustls"] }
sha2 = "=0.10.9"
