[workspace]
resolver = "3"
members = ["crates/ryo-wallet-service", "src-tauri"]
exclude = ["vendor/glib"]

[workspace.package]
edition = "2024"
rust-version = "1.98.1"
license = "MIT"

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
thiserror = "=2.0.20"
zeroize = { version = "=1.9.0", features = ["derive", "serde"] }
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread", "process", "sync", "time", "io-util", "net"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "rustls"] }
sha2 = "=0.10.9"

# GTK 0.18 still requires glib 0.18. Backport only the upstream pointer fix.
[patch.crates-io]
glib = { path = "vendor/glib" }

# The iterator advisory manifests under optimization; exercise that in tests.
[profile.test.package.glib]
opt-level = 3
